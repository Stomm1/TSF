<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchresultat - Trollhättans Squash Förening</title>

<style>
:root {
  --blue:#0047AB;
  --orange:#FF6600;
  --white:#fff;
  --bg:#f4faff;
}

body{
  font-family:Segoe UI,sans-serif;
  background:var(--bg);
  margin:0;
}

header{
  background:var(--blue);
  color:white;
  text-align:center;
  padding:1.5rem;
}

main{
  max-width:1000px;
  margin:auto;
  padding:2rem;
}

.result-card{
  background:white;
  border-radius:8px;
  padding:1.5rem;
  margin-bottom:1rem;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.result-card h3{
  color:var(--blue);
}

.score{
  font-size:2rem;
  font-weight:bold;
  color:var(--orange);
  margin-top:0.5rem;
}

.back-btn{
  display:inline-block;
  margin-top:2rem;
  background:var(--blue);
  color:white;
  text-decoration:none;
  padding:0.8rem 1.2rem;
  border-radius:5px;
}
</style>
</head>

<body>

<header>
  <h1>🏆 Matchresultat</h1>
</header>

<main>

<div class="result-card">
  <h3>Trollhättan SF vs Göteborg SK</h3>
  <div class="score">4 - 1</div>
  <p>Division 2 • 24 maj 2025</p>
</div>

<div class="result-card">
  <h3>Trollhättan SF vs Borås Squash</h3>
  <div class="score">3 - 2</div>
  <p>Division 2 • 10 maj 2025</p>
</div>

<div class="result-card">
  <h3>Trollhättan SF vs Lidköping</h3>
  <div class="score">2 - 3</div>
  <p>Division 2 • 26 april 2025</p>
</div>

<a href="index.html" class="back-btn">← Tillbaka till startsidan</a>

</main>

</body>
</html>
